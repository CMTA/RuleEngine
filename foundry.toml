[profile.default]
solc = "0.8.37"
src = 'src'
out = 'out'
libs = ['lib']
optimizer = true
optimizer_runs = 200
evm_version = 'prague'
# The vendored ERC-3643 `Token.sol` (T-REX 4.2.0-beta1) pins `pragma solidity 0.8.30` exactly, which cannot
# share a compilation unit with solc 0.8.37. The tests that deploy the real token therefore live in their own
# directory and are built by the `erc3643` profile below. Run them with:
#   FOUNDRY_PROFILE=erc3643 forge test
skip = ['test/ERC3643Real/**']

# Builds the project at solc 0.8.30 so the vendored ERC-3643 `Token.sol` compiles alongside our own contracts
# (`^0.8.20`; CMTAT and OpenZeppelin are `^0.8.24` at most, so 0.8.30 satisfies them).
[profile.erc3643]
solc = "0.8.30"
src = 'src'
out = 'out-erc3643'
libs = ['lib']
optimizer = true
optimizer_runs = 200
evm_version = 'prague'
# Profiles inherit unspecified keys from [profile.default]: clear `skip`, or this profile would skip the very
# tests it exists to run.
skip = []
match_path = 'test/ERC3643Real/*'
# ERC-3643 imports `@onchain-id/solidity`, an npm package rather than a submodule. `test/utils/onchainid/`
# holds minimal IIdentity / IClaimIssuer stubs, wired in by a CONTEXT-SCOPED remapping (the `lib/ERC-3643/:`
# prefix) so they apply to the ERC-3643 build only. It is declared here rather than in `remappings.txt` on
# purpose: `hardhat-foundry` reads `forge remappings` and rejects context-scoped lines.
remappings = [
    'lib/ERC-3643/:@onchain-id/solidity/contracts/=test/utils/onchainid/',
    'ERC3643/=lib/ERC-3643/contracts/',
]

# See more config options https://github.com/foundry-rs/foundry/tree/master/config
